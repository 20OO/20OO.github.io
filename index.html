<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>raven</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:white;
overflow:hidden;
cursor:url("https://files.catbox.moe/8xdatb.webp"), auto;

background:linear-gradient(-45deg,#0f172a,#1e293b,#020617,#0f172a);
background-size:400% 400%;
animation:bg 12s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
display:flex;
gap:40px;
align-items:center;
transition: opacity 0.3s ease, transform 0.3s ease;
}

.card{
width:320px;
padding:30px;
text-align:center;

background:rgba(255,255,255,0.05);
border-radius:20px;

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.1);

box-shadow:0 20px 40px rgba(0,0,0,0.6);

transition:transform .25s ease-out;
transform-style:preserve-3d;
will-change:transform;
}

.banner{
height:120px;
background:url("https://files.catbox.moe/wn9u5w.gif") center/cover;
border-radius:14px;
}

.avatar{
width:110px;
height:110px;
border-radius:50%;
border:4px solid white;
margin-top:-55px;

transition:all .25s ease;
cursor:pointer;
}

.avatar:hover{
transform:scale(1.08) translateY(-4px);

box-shadow:
0 0 20px rgba(255,255,255,0.4),
0 10px 20px rgba(0,0,0,0.5);
}

h2{
margin-top:10px;
}

.bio{
margin-top:10px;
color:#cbd5e1;
min-height:22px;
}

.links{
margin-top:20px;
}

.links a{
display:block;
margin:10px 0;
padding:12px;

background:rgba(255,255,255,0.08);
border-radius:12px;

color:white;
text-decoration:none;

transition:all .25s;
}

.links a:hover{
transform:translateY(-4px) scale(1.05);
background:rgba(255,255,255,0.2);
box-shadow:0 10px 20px rgba(0,0,0,.5);
}

.video-card{
width:320px;
padding:20px;
display:flex;
justify-content:center;
align-items:center;
}

.video-card iframe{
border-radius:12px;
}

/* Các nút hành động */
.action-btns {
display: flex;
gap: 8px;
justify-content: center;
margin-top: 10px;
flex-wrap: wrap;
}

.btn-custom {
padding: 10px 14px;
border-radius: 20px;
border: none;
background: rgba(255,255,255,0.1);
color: white;
cursor: pointer;
font-size: 13px;
transition: all .25s;
}

.btn-custom:hover {
transform: translateY(-3px) scale(1.05);
background: rgba(255,255,255,0.2);
box-shadow: 0 10px 20px rgba(0,0,0,.5);
}

.trail{
position:fixed;
width:8px;
height:8px;
background:white;
border-radius:50%;
pointer-events:none;
z-index:999;
opacity:.7;

filter:blur(1px);
box-shadow:0 0 10px white,0 0 20px rgba(255,255,255,0.5);
}

.heart{
position:fixed;
bottom:-20px;
font-size:16px;
pointer-events:none;
animation:floatUp linear forwards;
opacity:0.8;
}

@keyframes floatUp{
0%{
transform:translateY(0) scale(1);
opacity:0.9;
}
100%{
transform:translateY(-110vh) scale(1.5);
opacity:0;
}
}

/* loader */

#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#020617;

display:flex;
align-items:center;
justify-content:center;

z-index:99999;
cursor:pointer;

transition:opacity .5s ease;
}

.loader-text{
font-size:28px;
letter-spacing:4px;
color:white;
opacity:0.8;
}

/* ripple */

.full-ripple{
position:fixed;
left:50%;
top:50%;

width:20px;
height:20px;

border-radius:50%;
background:white;

transform:translate(-50%,-50%) scale(0);

animation:fullRipple 0.8s ease-out forwards;

z-index:9998;
pointer-events:none;
will-change: transform, opacity;
}

@keyframes fullRipple{
0%{
transform:translate(-50%,-50%) scale(0);
opacity:0.9;
}
100%{
transform:translate(-50%,-50%) scale(120);
opacity:0;
}
}

.blur-transition{
filter:blur(15px);
transition:filter .6s ease;
will-change: filter;
}

.fade-theme{
animation:themeFade .8s ease;
}

@keyframes themeFade{
from{
opacity:0;
transform:scale(.98);
}
to{
opacity:1;
transform:scale(1);
}
}

/* Modal hiển thị mã QR */
.qr-modal {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.7);
backdrop-filter: blur(8px);
display: flex;
align-items: center;
justify-content: center;
z-index: 100000;
opacity: 0;
pointer-events: none;
transition: opacity 0.3s ease;
}

.qr-modal.active {
opacity: 1;
pointer-events: auto;
}

.qr-content {
background: rgba(15, 23, 42, 0.95);
border: 1px solid rgba(255, 255, 255, 0.2);
padding: 25px;
border-radius: 20px;
text-align: center;
max-width: 300px;
width: 90%;
box-shadow: 0 20px 40px rgba(0,0,0,0.8);
transform: scale(0.8);
transition: transform 0.3s ease;
}

.qr-modal.active .qr-content {
transform: scale(1);
}

.qr-content img {
width: 200px;
height: 200px;
border-radius: 12px;
margin: 15px 0;
border: 2px solid rgba(255,255,255,0.2);
}

.qr-close {
background: rgba(255,255,255,0.1);
border: none;
color: white;
padding: 8px 16px;
border-radius: 12px;
cursor: pointer;
margin-top: 10px;
transition: background 0.2s;
}

.qr-close:hover {
background: rgba(255,255,255,0.3);
}

/* Tối ưu hóa kích thước cho điện thoại */
@media (max-width: 768px) {
    body {
        height: auto;
        overflow: auto;
        padding: 30px 0;
    }

    .container {
        flex-direction: column;
        gap: 20px;
    }

    .card, .video-card {
        width: 90vw;
        max-width: 320px;
    }
}

</style>
</head>

<body>

<div id="loader">
<div class="loader-text">enter</div>
</div>

<div class="container">

<div class="card tilt">

<div class="banner"></div>

<img src="https://files.catbox.moe/xwlv3d.gif" class="avatar">

<h2>raven</h2>

<p class="bio" id="bio"></p>

<div class="links">
<a href="https://www.facebook.com/28OOO" target="_blank">Facebook</a>
<a href="https://www.tiktok.com/@28x1o" target="_blank">TikTok</a>
<a href="https://www.youtube.com/@0ox0" target="_blank">YouTube</a>
<a href="https://discord.com/users/900581050256850984" target="_blank">Discord</a>
</div>

<div class="action-btns">
    <button class="btn-custom" onclick="toggleMusic()">Play Music</button>
    <button id="themeBtn" class="btn-custom">Switch Theme</button>
    <button class="btn-custom" onclick="openQR()">Buy Me A Coffee ☕</button>
</div>

</div>

<div class="card video-card tilt">

<iframe
id="videoPlayer"
width="300"
height="170"
src="https://www.youtube.com/embed/7o4o9NspwMk?enablejsapi=1"
frameborder="0"
allow="autoplay; encrypted-media"
allowfullscreen>
</iframe>

</div>

</div>

<div class="qr-modal" id="qrModal" onclick="closeQR(event)">
    <div class="qr-content">
        <h3>Buy Me A Coffee ☕</h3>
        <img src="https://files.catbox.moe/qbbsk9.png" alt="QR Code">
        <p style="font-size: 13px; color: #cbd5e1;">Thank you so much! ❤️</p>
        <button class="qr-close" onclick="forceCloseQR()">Close</button>
    </div>
</div>

<audio id="music" loop>
<source src="https://files.catbox.moe/49slbb.mp3">
</audio>

<script>

/* loader */

const loader=document.getElementById("loader")
const music=document.getElementById("music")

loader.addEventListener("click",()=>{

music.volume=0.6
music.play()

loader.style.opacity="0"

setTimeout(()=>{
loader.style.display="none"
},600)

})

/* typing bio */

const texts=[
"Love fades, memories don't.",
"True friends build on trust, not promises.",
"18+"
]

const bio=document.getElementById("bio")

let textIndex=0
let charIndex=0

function typeText(){

if(charIndex<texts[textIndex].length){

bio.innerHTML+=texts[textIndex].charAt(charIndex)
charIndex++

setTimeout(typeText,60)

}else{

setTimeout(()=>{

bio.innerHTML=""
charIndex=0
textIndex=(textIndex+1)%texts.length
typeText()

},20000)

}

}

typeText()

/* music */

function toggleMusic(){

if(music.paused){
music.play()
}else{
music.pause()
}

}

/* tilt */

const cards=document.querySelectorAll(".tilt")

document.addEventListener("mousemove",(e)=>{

const x=(window.innerWidth/2 - e.pageX)/30
const y=(window.innerHeight/2 - e.pageY)/30

cards.forEach(card=>{
card.style.transform=`rotateY(${x}deg) rotateX(${y}deg)`
})

})

/* cursor trail */

const dots=[]

for(let i=0;i<18;i++){

const d=document.createElement("div")
d.className="trail"
document.body.appendChild(d)

dots.push({x:0,y:0,el:d})

}

let mouseX=0
let mouseY=0

document.addEventListener("mousemove",(e)=>{
mouseX=e.clientX
mouseY=e.clientY
})

function animate(){

let x=mouseX
let y=mouseY

dots.forEach(dot=>{

dot.x+=(x-dot.x)*0.25
dot.y+=(y-dot.y)*0.25

dot.el.style.left=dot.x+"px"
dot.el.style.top=dot.y+"px"

x=dot.x
y=dot.y

})

requestAnimationFrame(animate)

}

animate()

/* hearts */

function createHeart(){

const heart=document.createElement("div")
heart.className="heart"
heart.innerHTML="❤"

heart.style.left=Math.random()*100+"vw"
heart.style.animationDuration=(4+Math.random()*4)+"s"

document.body.appendChild(heart)

setTimeout(()=>{
heart.remove()
},8000)

}

setInterval(createHeart,500)

/* theme switch phân tách Desktop vs Mobile */

const themeBtn=document.getElementById("themeBtn")
let themeActive=false
let gifBg=null

themeBtn.addEventListener("click",()=>{
const isMobile = window.innerWidth <= 768;

if(isMobile) {
    const container = document.querySelector(".container");
    container.style.opacity = "0";
    
    setTimeout(() => {
        toggleTheme();
        container.style.opacity = "1";
    }, 250);
} else {
    const ripple = document.createElement("div");
    ripple.className = "full-ripple";
    document.body.appendChild(ripple);

    document.body.classList.add("blur-transition");

    setTimeout(toggleTheme, 400);

    setTimeout(() => {
        document.body.classList.remove("blur-transition");
        ripple.remove();
    }, 900);
}
})

function toggleTheme(){

const container=document.querySelector(".container")
const avatar=document.querySelector(".avatar")
const banner=document.querySelector(".banner")

container.classList.add("fade-theme")

if(!themeActive){

avatar.src="https://files.catbox.moe/prr0a8.gif"

banner.style.backgroundImage="url('https://files.catbox.moe/7ixpch.gif')"

/* Tạo thẻ div chứa ảnh GIF nền thay cho video */
gifBg=document.createElement("div")
gifBg.style.position="fixed"
gifBg.style.top="0"
gifBg.style.left="0"
gifBg.style.width="100%"
gifBg.style.height="100%"
gifBg.style.backgroundImage="url('https://files.catbox.moe/tv7b4d.gif')"
gifBg.style.backgroundSize="cover"
gifBg.style.backgroundPosition="center"
gifBg.style.zIndex="-2"

document.body.appendChild(gifBg)

themeActive=true

}else{

avatar.src="https://files.catbox.moe/xwlv3d.gif"

banner.style.backgroundImage='url("https://files.catbox.moe/wn9u5w.gif")'

if(gifBg){
gifBg.remove()
gifBg=null
}

themeActive=false

}

}

/* Xử lý popup QR */
function openQR(){
    document.getElementById("qrModal").classList.add("active");
}

function closeQR(e){
    if(e.target.id === "qrModal") {
        document.getElementById("qrModal").classList.remove("active");
    }
}

function forceCloseQR(){
    document.getElementById("qrModal").classList.remove("active");
}

</script>

</body>
</html>
